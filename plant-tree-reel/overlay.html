<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G;src:url(gloock.woff2)}
html,body{margin:0;width:1080px;height:1350px;background:transparent;overflow:hidden}
#stage{position:absolute;inset:0}
.ph{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:G;color:#f4ead4;line-height:.98;padding:0 70px;box-sizing:border-box}
.ph .in{display:block}
.wd{display:inline-block;white-space:pre;will-change:transform}
.r{color:#ff3b2b}
.glow{text-shadow:0 0 2px rgba(244,234,212,.8),0 0 26px rgba(255,220,170,.30),0 0 46px rgba(0,0,0,.55),0 4px 16px rgba(0,0,0,.65)}
.r.glow{text-shadow:0 0 22px rgba(255,60,40,.45),0 0 50px rgba(0,0,0,.7),0 4px 16px rgba(0,0,0,.8)}
.layer{position:absolute;inset:0;pointer-events:none}
#sprout{position:absolute;width:96px;height:120px;left:50%;bottom:72%;transform:translateX(-50%);overflow:visible}
</style></head><body><div class="layer" id="scrim" style="background:radial-gradient(ellipse 62% 22% at 50% 50%,rgba(0,0,0,.55),rgba(0,0,0,.25) 55%,rgba(0,0,0,0) 100%)"></div><div id="stage"></div>
<div class="layer" id="leak"></div><div class="layer" id="burn"></div><div class="layer" id="flash" style="background:#fff8ea;opacity:0"></div>
<script>
const P=[ // t, text, opts
 [0.00,"if only",{s:118}],
 [1.35,"we started *younger*",{s:110}],
 [2.95,"then we would have been",{s:96}],
 [3.90,"so much better",{s:112}],
 [4.97,"if we knew",{s:112}],
 [5.62,"back then",{s:118}],
 [6.20,"what we did now",{s:108}],
 [7.58,"things would change",{s:104}],
 [8.92,"here's the thing",{s:74,type:1}],
 [10.15,"today",{s:210,punch:1}],
 [10.94,"is the youngest",{s:112}],
 [12.00,"you'll ever be again",{s:100}],
 [13.60,"and you still have",{s:104}],
 [14.30,"*enough* time",{s:124}],
 [15.09,"to become",{s:118}],
 [15.89,"all you wanted",{s:112}],
 [16.78,"to be in life",{s:116}],
 [18.18,"the best time",{s:116}],
 [18.88,"to plant a tree",{s:112}],
 [19.78,"may have been",{s:112}],
 [20.34,"*twenty* years ago",{s:112,flicker:1}],
 [21.56,"but",{s:84,slow:1}],
 [22.09,"the second best time",{s:104,stagger:.16}],
 [23.81,"is right|now",{s:118,now:1}],
 [24.86,"it's never too late|to *change.*",{s:84,quote:1}],
];
const END=28.5;
const stage=document.getElementById('stage');
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
const back=x=>{x=Math.min(Math.max(x,0),1);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
let cur=-1,words=[],sprout=null;
function build(i){
  stage.innerHTML='';words=[];sprout=null;
  const [t0,txt,o]=P[i];
  const ph=document.createElement('div');ph.className='ph';ph.style.fontSize=o.s+'px';
  if(o.quote){ph.style.lineHeight='1.02';}
  const inn=document.createElement('div');inn.className='in';ph.appendChild(inn);
  txt.split('|').forEach((line,li)=>{
    const ld=document.createElement('div');
    if(o.now&&li==1){ld.style.fontSize='1.9em';ld.style.marginTop='.12em'}
    if(o.quote&&li==1){ld.style.fontSize='1.55em';ld.style.marginTop='.08em'}
    line.split(' ').forEach((w,wi,arr)=>{
      const red=/^\*.*\*$/.test(w);w=w.replace(/\*/g,'');
      const s=document.createElement('span');s.className='wd glow'+(red?' r':'');
      if(o.now&&w==='now'){ // sprout out of the "o"
        s.innerHTML='n<span id="o" style="position:relative;display:inline-block">o</span>w';
      } else if(o.type){ s.innerHTML=[...w].map(c=>`<span class="ch" style="opacity:0">${c}</span>`).join('');}
      else s.textContent=w;
      ld.appendChild(s); if(wi<arr.length-1) ld.appendChild(document.createTextNode(' '));
      words.push(s);
    });
    inn.appendChild(ld);
  });
  stage.appendChild(ph);
  if(o.now){
    const ob=document.getElementById('o');
    ob.insertAdjacentHTML('beforeend',`<svg id="sprout" viewBox="0 0 120 150"><path id="stem" d="M60 150 C60 120 58 95 62 62" stroke="#f6c443" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path id="lf1" d="M61 82 C40 80 22 66 18 44 C42 44 58 58 61 82Z" fill="#f6c443"/><path id="lf2" d="M62 66 C78 58 96 42 100 18 C74 22 62 40 62 66Z" fill="#f6c443"/></svg>`);
    sprout=document.getElementById('sprout');
    const stem=document.getElementById('stem');const L=stem.getTotalLength();stem.style.strokeDasharray=L;stem.dataset.L=L;
  }
}
function render(t){
  let i=0;for(let k=0;k<P.length;k++) if(t>=P[k][0]-1e-6) i=k;
  if(i!==cur){build(i);cur=i}
  const [t0,txt,o]=P[i];const lt=t-t0;const t1=(P[i+1]||[END])[0];
  const stag=o.stagger??0.055;
  words.forEach((w,k)=>{
    let st=lt-k*stag; let dur=o.slow?0.45:0.2;
    let p=ease(st/dur), pb=back(st/0.26);
    let sc=o.punch? 1.45-0.45*back(st/0.3) : 1.16-0.16*pb;
    let blur=(1-p)*10, op=Math.min(1,Math.max(0,st/(dur*0.6)));
    if(o.quote){const st2=lt-0.55-k*0.2;dur=0.55;p=ease(st2/dur);sc=(k==words.length-1?1.25-0.25*back(st2/0.4):1.08-0.08*p);blur=(1-p)*8;op=p}
    if(o.flicker){op*=0.82+0.18*hash(Math.floor(t*30)+k)}
    const drift=1+0.025*Math.min(lt/(t1-t0),1); // slow push on text
    w.style.transform=`translateY(${(1-p)*14}px) scale(${sc*drift})`;
    w.style.filter=`blur(${blur.toFixed(2)}px)`;w.style.opacity=op;
    if(o.type){[...w.querySelectorAll('.ch')].forEach((c,ci)=>{c.style.opacity=lt> (ci+k*6)*0.028?1:0})}
  });
  if(sprout){
    const g=ease((lt-0.25)/0.55);const stem=document.getElementById('stem');const L=+stem.dataset.L;
    stem.style.strokeDashoffset=L*(1-g);
    ['lf1','lf2'].forEach((id,j)=>{const e=document.getElementById(id);const q=back((lt-0.55-j*0.12)/0.4);
      e.style.transformOrigin=j?'62px 66px':'61px 82px';e.style.transform=`scale(${Math.max(q,0)})`});
    sprout.style.filter='drop-shadow(0 0 14px rgba(246,196,67,.7))';
  }
  const sb=(P[i][1]===''||lt<0)?0:Math.min(1,lt/0.15);document.getElementById('scrim').style.opacity=(t>28.1?Math.max(0,1-(t-28.1)/0.35):1)*sb;
  // flashes on big beats
  let fl=0;[[10.15,.9],[23.81,.85],[18.18,.35],[1.35,.18],[15.89,.2],[24.86+0.55+5*0.2,.22]].forEach(([c,a])=>{const d=t-c;if(d>=0&&d<0.2)fl=Math.max(fl,a*Math.pow(1-d/0.2,1.6))});
  document.getElementById('flash').style.opacity=fl;
  // light leaks: warm blobs drifting across on section entries
  let leak='';[[10.15,1.3,'255,120,40'],[18.18,1.4,'255,150,60'],[23.81,1.1,'255,90,30'],[0,1.2,'90,140,255'],[6.20,0.9,'255,110,60'],[14.30,0.9,'255,160,80']].forEach(([c,d,col],j)=>{
    const x=(t-c)/d;if(x<0||x>1)return;const a=Math.sin(Math.PI*x)*0.55;
    const px=-30+x*160, py=20+50*Math.sin(j+x*2);
    leak+=`radial-gradient(ellipse 55% 70% at ${px}% ${py}%, rgba(${col},${a}) 0%, rgba(${col},${a*0.4}) 35%, rgba(${col},0) 70%),`;});
  document.getElementById('leak').style.background=leak?leak.slice(0,-1):'none';
  // film burn into the quote
  const bx=(t-24.45)/1.05; let burn='none';
  if(bx>0&&bx<1){const a=Math.sin(Math.PI*Math.min(bx*1.4,1))*(bx<0.4?1:1-(bx-0.4)/0.6);
    burn=`radial-gradient(circle at ${85-bx*30}% ${80-bx*40}%, rgba(255,250,235,${a}) 0%, rgba(255,190,90,${a*0.95}) ${20+bx*40}%, rgba(220,60,20,${a*0.7}) ${45+bx*40}%, rgba(120,20,0,0) ${70+bx*30}%)`;}
  document.getElementById('burn').style.background=burn;
  // gentle fade out at the very end to loop
  stage.style.opacity = t>28.1? Math.max(0,1-(t-28.1)/0.35):1;
}
window.render=render;
</script></body></html>

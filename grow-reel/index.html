<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Motion Reel</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="reel.js"></script>
<script>
  // Live preview when opened in a browser (?render disables the loop).
  if (!location.search.includes('render')) {
    window.ready.then(() => {
      const start = performance.now();
      const loop = () => {
        const f = Math.floor(((performance.now() - start) / 1000 % 14) * 30);
        window.drawFrame(f, 1);
        requestAnimationFrame(loop);
      };
      loop();
    });
  }
</script>
</body>
</html>
